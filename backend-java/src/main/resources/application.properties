spring.application.name=cti-nexus-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cti_nexus}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always

etl.api.url=${ETL_API_URL:http://localhost:8000/etl}
etl.api.key=${ETL_API_KEY:}
auth.jwt.secret=${JWT_SECRET:}
auth.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
auth.bootstrap.email=${AUTH_ADMIN_EMAIL:}
auth.bootstrap.password=${AUTH_ADMIN_PASSWORD:}
auth.bootstrap.name=${AUTH_ADMIN_NAME:Administrador}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
