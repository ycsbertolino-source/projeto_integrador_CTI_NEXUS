# ---- MODO LOCAL: banco H2 num arquivo dentro do projeto (sem Azure, sem internet) ----
# Para usar:  .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=local"
# Os dados ficam em backend/data/ e continuam lá quando você desliga o backend.
# Para começar do zero, apague a pasta backend/data.

spring.datasource.url=jdbc:h2:file:./data/ctinexus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Admin padrão do modo local, caso o .env não tenha ADMIN_PASSWORD
app.admin.senha=${ADMIN_PASSWORD:Admin12345}
